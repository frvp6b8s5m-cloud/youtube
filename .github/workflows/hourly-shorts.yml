name: Cloud Shorts Factory

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "12 1 * * *"
    - cron: "24 2 * * *"
    - cron: "36 3 * * *"
    - cron: "48 4 * * *"
    - cron: "0 6 * * *"
    - cron: "12 7 * * *"
    - cron: "24 8 * * *"
    - cron: "36 9 * * *"
    - cron: "48 10 * * *"
    - cron: "0 12 * * *"
    - cron: "12 13 * * *"
    - cron: "24 14 * * *"
    - cron: "36 15 * * *"
    - cron: "48 16 * * *"
    - cron: "0 18 * * *"
    - cron: "12 19 * * *"
    - cron: "24 20 * * *"
    - cron: "36 21 * * *"
    - cron: "48 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-shorts-factory
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate, render, QA, and publish
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY_STATUS: private
        run: python -m src.main
